services:
  - type: web
    name: aerial-threat-tracker
    env: python
    region: frankfurt  # Ближайший регион к Украине
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION_STRING
        sync: false
      - key: MONITORED_CHANNELS
        value: ""
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
        sync: false
      - key: SECRET_KEY
        generateValue: true
        sync: false
    healthCheckPath: /api/health
