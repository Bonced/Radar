<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в панель управления</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: #0a0e14;
            color: #e8edf2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: #1a2028;
            border: 1px solid #3d4d5f;
            border-radius: 8px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .logo-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #00ff88;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #8a95a3;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: #121820;
            border: 1px solid #2a3542;
            border-radius: 4px;
            color: #e8edf2;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            transition: all 0.2s;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 0 2px rgba(0, 255, 136, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #00ff88;
            color: #0a0e14;
            border: none;
            border-radius: 4px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        button:hover {
            background: #00dd77;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 255, 136, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid #ff3366;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 24px;
            color: #ff3366;
            font-size: 14px;
            text-align: center;
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
        }

        .back-link a {
            color: #8a95a3;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .back-link a:hover {
            color: #00ff88;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">🔒</div>
            <div class="logo-title">ПАНЕЛЬ УПРАВЛЕНИЯ</div>
        </div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/admin/login">
            <div class="form-group">
                <label for="password">Пароль администратора</label>
                <input type="password" id="password" name="password" required autofocus>
            </div>

            <button type="submit">Войти</button>
        </form>

        <div class="back-link">
            <a href="/">← Вернуться на карту</a>
        </div>
    </div>
</body>
</html>
